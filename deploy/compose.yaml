# hamcam: antenna camera with a calibrated overlay - https://github.com/sq6emm/hamcam
#   go2rtc (camera -> WebRTC), telemetry (rotator, weather, beacons, TLEs, summits), web (page + overlay).
# This directory holds the configuration: this file, .env (from .env.example), go2rtc.yaml, config/objects.json.
# Images come from GitHub Container Registry; to build from source add:  -f compose.build.yaml
name: hamcam

x-common: &common
  restart: unless-stopped
  labels:
    project: hamcam
    owner: ${HAMCAM_OWNER:-hamcam}

services:
  go2rtc:
    <<: *common
    image: alexxit/go2rtc:1.9.14
    container_name: hamcam-go2rtc
    environment:                         # substituted into go2rtc.yaml (${...}); values live in .env
      CAMERA_MAIN_URL: ${CAMERA_MAIN_URL:?set CAMERA_MAIN_URL in .env}
      CAMERA_SUB_URL: ${CAMERA_SUB_URL:-}
      WEBRTC_CANDIDATE_LAN: ${WEBRTC_CANDIDATE_LAN:-}
      WEBRTC_CANDIDATE_WAN: ${WEBRTC_CANDIDATE_WAN:-}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "8556:8556/tcp"                  # WebRTC media (TCP fallback)
      - "8556:8556/udp"                  # WebRTC media
      - "127.0.0.1:8557:8554/tcp"        # RTSP restream for local tools (calibration)

  telemetry:
    <<: *common
    image: ghcr.io/sq6emm/hamcam-telemetry:${HAMCAM_VERSION:-latest}
    container_name: hamcam-telemetry
    environment:
      ROTCTLD_HOST: ${ROTCTLD_HOST:-}    # empty -> simulated azimuth sweep
      ROTCTLD_PORT: ${ROTCTLD_PORT:-4533}
      WEATHER_URL: ${WEATHER_URL:-}
      WEATHER_FIELDS: ${WEATHER_FIELDS:-}
      OBJECTS_FILE: /config/objects.json # station location comes from here (single source, same file as the page)
      BEACON_FILE: /data/beacons.json
      BEACON_BAND: ${BEACON_BAND:-23cm}
      BEACON_MAX_KM: ${BEACON_MAX_KM:-900}
      BEACON_KEEP_DAYS: ${BEACON_KEEP_DAYS:-90}
      TLE_GROUPS: ${TLE_GROUPS:-visual,amateur}
      SOTA_ASSOCIATIONS: ${SOTA_ASSOCIATIONS:-SP,OK}
      SUMMIT_MAX_KM: ${SUMMIT_MAX_KM:-250}
      CONTROL_ALLOW: ${CONTROL_ALLOW:-}  # rotator control for these networks (CIDRs); empty = disabled
      TRACK_STEP_DEG: ${TRACK_STEP_DEG:-2}
      TRACK_MIN_INTERVAL_S: ${TRACK_MIN_INTERVAL_S:-3}
      TRACK_LEASE_S: ${TRACK_LEASE_S:-10}
      ROT_EL_MIN: ${ROT_EL_MIN:-0}
      ROT_EL_MAX: ${ROT_EL_MAX:-90}
      QTHDB_URL: ${QTHDB_URL:-https://qthdb.hamradio.pl}   # callsign -> locator for the point-to field
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}    # the front proxy itself is never accepted as a control client
    user: "${HAMCAM_UID:-1000}:${HAMCAM_GID:-1000}"   # must be able to write HAMCAM_DATA
    volumes:
      - ${HAMCAM_DATA:-./data}:/data     # persistent beacon list, TLEs, summits
      - ./config:/config:ro              # objects.json (directory mount: survives editors replacing the file)

  web:
    <<: *common
    image: ghcr.io/sq6emm/hamcam-web:${HAMCAM_VERSION:-latest}
    container_name: hamcam-web
    environment:
      ADSB_URL: ${ADSB_URL:-http://127.0.0.1:9/none}   # aircraft.json of the ADS-B receiver (tar1090/readsb/ultrafeeder)
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1}       # front proxy whose X-Forwarded-For is trusted (client IP for control)
    volumes:
      - ./config:/config:ro              # objects.json, served at /objects.json
    ports:
      - "${HAMCAM_WEB_PORT:-8097}:8080"
    depends_on: [go2rtc, telemetry]
