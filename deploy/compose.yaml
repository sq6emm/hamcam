# hamcam: camera passthrough via go2rtc (WebRTC, MSE fallback) + browser-side HUD.
# Configuration lives here (/etc/docker-compose/hamcam): this file, .env, go2rtc.yaml, nginx.conf.template, config/objects.json.
# Code and data live in ${HAMCAM_DIR} (default /data/claude/hamcam): page, telemetry source, persistent data, tools. See README.md.
# Page: http://192.168.12.12:8097/  (public: https://sq6emm.hamradio.pl/camera/ via front proxy)
name: hamcam-proto

x-common: &common
  restart: unless-stopped
  labels:
    owner: claude
    project: hamcam

services:
  go2rtc:
    <<: *common
    image: alexxit/go2rtc:1.9.14
    container_name: hamcam-go2rtc
    environment:                         # substituted into go2rtc.yaml (${...}); values live in .env
      CAMERA_MAIN_URL: ${CAMERA_MAIN_URL:?set CAMERA_MAIN_URL in .env}
      CAMERA_SUB_URL: ${CAMERA_SUB_URL:-}
      WEBRTC_CANDIDATE_LAN: ${WEBRTC_CANDIDATE_LAN:-}
      WEBRTC_CANDIDATE_WAN: ${WEBRTC_CANDIDATE_WAN:-}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "8556:8556/tcp"     # WebRTC media (TCP fallback)
      - "8556:8556/udp"     # WebRTC media
      - "127.0.0.1:8557:8554/tcp"  # RTSP restream for local tools (calibration)

  telemetry:
    <<: *common
    build: ${HAMCAM_DIR:-/data/claude/hamcam}/telemetry
    image: hamcam-telemetry:dev
    container_name: hamcam-telemetry
    environment:
      ROTCTLD_HOST: ${ROTCTLD_HOST:-}      # empty -> simulated azimuth sweep
      ROTCTLD_PORT: ${ROTCTLD_PORT:-4533}
      WEATHER_URL: ${WEATHER_URL:-}
      WEATHER_FIELDS: ${WEATHER_FIELDS:-}
      OBJECTS_FILE: /config/objects.json # station location comes from here (single source, same file as the page)
      BEACON_FILE: /data/beacons.json
      BEACON_BAND: ${BEACON_BAND:-23cm}
      BEACON_MAX_KM: ${BEACON_MAX_KM:-900}
      BEACON_KEEP_DAYS: ${BEACON_KEEP_DAYS:-90}
      TLE_GROUPS: ${TLE_GROUPS:-visual,amateur}
      SOTA_ASSOCIATIONS: ${SOTA_ASSOCIATIONS:-SP,OK}
      SUMMIT_MAX_KM: ${SUMMIT_MAX_KM:-250}
    user: "1001:1001"                    # owner of ./telemetry/data on the host
    volumes:
      - ${HAMCAM_DIR:-/data/claude/hamcam}/telemetry/data:/data   # persistent beacon list, TLEs, summits
      - ./config:/config:ro              # objects.json (directory mount: survives editors replacing the file)

  web:
    <<: *common
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: hamcam-web
    environment:
      ADSB_URL: ${ADSB_URL:-http://127.0.0.1:9/none}   # aircraft.json of the ADS-B receiver (tar1090/readsb/ultrafeeder)
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro   # ${ADSB_URL} filled in at start
      - ${HAMCAM_DIR:-/data/claude/hamcam}/web/www:/usr/share/nginx/html:ro
      - ./config:/config:ro              # objects.json, served at /objects.json
    ports:
      - "8097:8080"
    depends_on: [go2rtc, telemetry]
